name: release

# 버전 태그(vX.Y.Z)를 푸시하면 서명된 번들과 자동 업데이트 매니페스트(latest.json)를
# GitHub Releases에 게시한다. 앱은 tauri.conf.json의 updater endpoint에서 이 매니페스트를 읽어
# 자동으로 새 버전을 확인·설치한다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust 툴체인 설치(유니버설 타깃)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: 프런트엔드 의존성 설치
        run: pnpm install --frozen-lockfile

      # Apple 공증(notarization)용 App Store Connect API 키(.p8)를 파일로 복원한다.
      # APPLE_API_KEY_P8 시크릿(=.p8 base64)이 있을 때만 동작하며, 없으면 조용히 건너뛴다.
      - name: Apple API 키 준비(선택)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: 빌드·서명·릴리스
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이트 서명 키(minisign). Settings → Secrets and variables → Actions 에 등록한다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple 코드서명(Developer ID Application 인증서). 비어 있으면 ad-hoc로 빌드된다.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple 공증(App Store Connect API 키 방식). APPLE_API_KEY_PATH는 위 스텝이 설정한다.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Worklane ${{ github.ref_name }}"
          releaseBody: "앱이 자동으로 이 릴리스로 업데이트됩니다."
          releaseDraft: false
          prerelease: false
          # macOS 유니버설 바이너리 하나로 arm64/x86_64를 모두 커버한다.
          args: --target universal-apple-darwin
